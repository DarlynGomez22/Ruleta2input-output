<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Peripheral Roulette</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px;
}

h1{
    margin-bottom:20px;
    font-size:40px;
    text-shadow:0 0 15px cyan;
}

.container{
    position:relative;
    width:420px;
    height:420px;
}

.flecha{
    position:absolute;
    top:-15px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:50px solid white;

    filter:drop-shadow(0 0 10px cyan);
}

.ruleta{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;

    border:10px solid white;

    background:
    conic-gradient(
        #ff4d4d 0deg 180deg,
        #38bdf8 180deg 360deg
    );

    box-shadow:
        0 0 30px cyan,
        inset 0 0 30px rgba(255,255,255,.3);

    transition:transform 5s cubic-bezier(0.17, 0.67, 0.2, 1);
}

.texto{
    position:absolute;
    left:50%;
    top:50%;
    font-size:18px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 5px black;
    transform-origin:center;
}

.t1{
    transform:rotate(90deg) translateY(-130px) rotate(-90deg);
}

.t2{
    transform:rotate(270deg) translateY(-130px) rotate(-270deg);
}

.t3{
    transform:rotate(160deg) translateY(-115px) rotate(-160deg);
}

.t4{
    transform:rotate(225deg) translateY(-150px) rotate(-225deg);
}

.t5{
    transform:rotate(270deg) translateY(-150px) rotate(-270deg);
}

.t6{
    transform:rotate(320deg) translateY(-160px) rotate(-320deg);
}

.centro{
    position:absolute;
    width:120px;
    height:120px;
    background:radial-gradient(circle,#ffffff,#cbd5e1);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:15;
    border:10px solid #06b6d4;

    box-shadow:
        0 0 20px cyan,
        inset 0 0 20px rgba(255,255,255,.8);
}

.botones{
    display:flex;
    gap:20px;
    margin-top:30px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    background:cyan;
    color:#001;
    transition:.3s;
    box-shadow:0 0 20px cyan;
}

button:hover{
    transform:scale(1.05);
    background:white;
}

.resultado{
    margin-top:40px;
    width:95%;
    max-width:1200px;
    display:none;
    animation:fade .8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.resultado h2{
    text-align:center;
    margin-bottom:25px;
    font-size:35px;
    color:cyan;
}

.cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

/* TARJETAS GIRATORIAS */

.card{
    height:340px;
    perspective:1000px;
}

.card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .8s;
    transform-style:preserve-3d;
}

.card:hover .card-inner{
    transform:rotateY(180deg);
}

.card-front,
.card-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    overflow:hidden;
    backface-visibility:hidden;
    background:#1e293b;
    box-shadow:0 0 15px rgba(0,255,255,.3);
}

.card-front img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-front h3{
    padding:15px;
    text-align:center;
}

.card-back{
    transform:rotateY(180deg);
    
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;
}

.card-back h4{
    text-align:center;
    color:cyan;
}

.card-back p{
    font-size:14px;
    line-height:1.4;
}



.card-back textarea:focus{
    outline:2px solid cyan;
}

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .container{
        width:320px;
        height:320px;
    }
}

</style>
</head>

const categorias = [
"Input",
"Output"
];

let rotacionActual = 0;
let girando = false;
let indiceActual = 0;

const posiciones = [
270,
90
];

function girarRuleta(){

if(girando) return;

girando = true;

const ruleta = document.getElementById("ruleta");

const indice =
Math.floor(Math.random() * categorias.length);

indiceActual = indice;

const categoria = categorias[indice];

const vueltas = 360 * 8;

const destino = posiciones[indice];

rotacionActual =
rotacionActual +
vueltas +
(360 - (rotacionActual % 360) + destino);

ruleta.style.transform =
`rotate(${rotacionActual}deg)`;

setTimeout(()=>{

mostrarCategoria(categoria);

girando = false;

},5000);

}

function siguienteCategoria(){

if(girando) return;

girando = true;

const ruleta =
document.getElementById("ruleta");

indiceActual++;

if(indiceActual >= categorias.length){
indiceActual = 0;
}

const categoria =
categorias[indiceActual];

const destino =
posiciones[indiceActual];

const rotacionObjetivo =
rotacionActual + 180;

rotacionActual =
rotacionObjetivo -
(rotacionObjetivo % 360) +
destino;

ruleta.style.transform =
`rotate(${rotacionActual}deg)`;

setTimeout(()=>{

mostrarCategoria(categoria);

girando = false;

},2000);

}

function mostrarCategoria(categoria){

const resultado =
document.getElementById("resultado");

resultado.style.display = "block";

let html = `
<h2>${categoria}</h2>
<div class="cards">
`;

datos[categoria].forEach(item=>{

html += `
<div class="card">

<div class="card-inner">

<div class="card-front">

<img src="${item.imagen}" alt="${item.nombre}">

<h3>${item.nombre}</h3>

</div>

<div class="card-back">

<h4>${item.nombre}</h4>
 <br>
<ul>
    <li>${item.idea}</li> 
    <br>
    <li>${item.idea1}</li>
    <br>
  </ul>
.

</div>

</div>

</div>
`;

});

html += `</div>`;

resultado.innerHTML = html;

resultado.scrollIntoView({
behavior:"smooth"
});

}
</script>
